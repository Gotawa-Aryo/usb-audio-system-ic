# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "Modular USB Audio Codec with Audio Output"
  team: "XLR8"
  discord: "gotawa_aryo"
  description: "Single-chip USB-to-audio interface system consisting of USB interface (UAC 1.0) standard and DAC audio output."
  lvs_config: "lvs_config.json"
  gf_def_ready: true            # data ready for def generation with global foundries' pad frame
  ws_def_ready: true            # data ready for def generation with wafer space pad frame
  drc_ready: false              # data ready for integration and DRC
  lvs_ready: false              # data ready for integrated LVS

# There are 7 i/o pin types and the associated connections from the user area to the i/o pad cell
# all control signals must be connected
# ground: 
#   <name> connects to DVSS
# power: 
#   <name> connects to DVDD
# input_cmos: digital input with no hysteresis
#   <name> connects to Y
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
# input_schmitt: digital input with hysteresis
#   <name> connects to Y
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
# bidirectional: programmable drive strength PDRV[1:0] - 00: 4mA, 01: 8mA, 10: 12mA, 11: 16mA
#   <name>_IN connects to Y
#   <name>_OUT connects to A
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
#     <name_CS>: input type - low is cmos buffer, high is schmitt trigger
#     <name_SL>: output slew rate - low is fast, high is slow
#     <name_IE>: input enable - high for input PAD -> Y
#     <name_OE>: output enable - high for output A -> PAD
#     <name_PDRV0>: drive strength lsb
#     <name_PDRV1>: drive strength msb
# bidirectional_24ma: fixed drive strength 24mA
#   <name>_IN connects to Y
#   <name>_OUT connects to A
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
#     <name_CS>: input type - low is cmos buffer, high is schmitt trigger
#     <name_SL>: output slew rate - low is fast, high is slow
#     <name_IE>: input enable - high for input PAD -> Y
#     <name_OE>: output enable - high for output A -> PAD
# analog:
#   <name> connects to ASIG5V
#   Note: secondary_esd flag is ignored

pins:
  # --- ANALOG AND POWER SUPPLY ---
  - name: VSS                   # Ground reference (for both digital and analog)
    io_type: ground             # note: due to a common ground connection, ground pads are generally not needed.
  - name: AUDIO_OUT_L           # Left-channel analog audio output
    io_type: analog
    secondary_esd: false
  - name: VDD                   # Positive power supply input (for both digital and analog)
    io_type: power

  # --- DIGITAL INPUTS ---
  - name: SYS_CLK_60M           # Main 60 MHz system clock input
    io_type: input_schmitt
  - name: RESET_N               # Active-low system global reset input
    io_type: input_cmos
  - name: DAC_FB_IN_L           # Left-channel Delta-Sigma DAC feedback input to the analog section
    io_type: input_cmos
  # --- DIGITAL OUTPUTS ---
  # These are output-only, but no output-only io_type exists [?]. So these use bidirectional pads instead.
  - name: USB_DP_PULL           # Enables the 1.5 kOhm pull-up resistor on the USB D+ line
    io_type: bidirectional
  - name: DAC_MOD_OUT_L         # Left-channel Delta-Sigma DAC modulator output bitstream
    io_type: bidirectional
  # --- DIGITAL BIDIRECTIONAL ---
  - name: USB_DP                # USB Full-Speed D+ differential data line
    io_type: bidirectional
  - name: USB_DN                # USB Full-Speed D- differential data line
    io_type: bidirectional